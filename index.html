<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
<style>
:root{--bg:#f6f4f0;--card:#fff;--tx:#1d1b20;--mu:#6b6670;--ac:#b3261e;--ac2:#fff;--bd:#e2ded8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131a;--card:#221f2a;--tx:#f1eef5;--mu:#a29cae;--ac:#e0524a;--bd:#38343f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:24px;margin:6px 0 4px}h2{font-size:20px;margin:4px 0 10px}p{margin:6px 0}.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--ac);color:var(--ac2);width:100%;margin-top:10px;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.4}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-top:8px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pick button{margin:0;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.pick button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.big{font-size:64px;text-align:center;margin:10px 0}.code{font-size:44px;letter-spacing:8px;text-align:center;font-weight:800}
.timer{font-size:56px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.dead{text-decoration:line-through;opacity:.5}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bd);margin-left:6px}
.say{border-left:4px solid var(--ac);padding-left:10px;font-style:italic}
.night{background:#0b0a10;color:#c9c4d6;border-radius:14px;padding:40px 16px;text-align:center;margin:12px 0}
.err{color:var(--ac);font-size:14px}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head><body><div id="app"></div>
<script>
const R={m:["🔪","Mafia"],dr:["💉","Doctor"],d:["🔍","Detective"],v:["🧑‍🌾","Villager"]};
const $=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}return null};
const fmt=s=>Math.max(0,Math.floor(s/60))+":"+String(Math.max(0,s)%60).padStart(2,"0");
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let pid=LS("mf_pid");if(!pid){pid=Math.random().toString(36).slice(2,10);LS("mf_pid",pid)}
let mode="",peer=null,H=null,conns={},V=null,conn=null,err="",sel=null,selKey="",peek=false,vEnd=0,code="",name=LS("mf_name")||"",busy=false;
const hashCode=(location.hash||"").slice(1).toUpperCase().slice(0,4);
/* ---------- HOST ---------- */
const rc=()=>Array.from({length:4},()=>"ABCDEFGHJKMNPQRSTUVWXYZ"[Math.floor(Math.random()*23)]).join("");
const save=()=>LS("mf_host",JSON.stringify(H));
const done=(id,k)=>H.acts[id]&&H.acts[id][k+"r"]===H.round;
const hp=id=>H.P.find(p=>p.id===id);
const hAlive=()=>H.P.filter(p=>p.alive);
const hRole=r=>H.P.find(p=>p.role===r);
function hostStart(saved){
 busy=true;err="";render();
 const c=saved?saved.code:rc();
 peer=new Peer("mafia-"+c);
 peer.on("open",()=>{busy=false;mode="host";code=c;H=saved||{code:c,phase:"lobby",round:1,msg:"",winner:"",voteEnd:0,inv:null,P:[],acts:{}};save();sendAll();render()});
 peer.on("error",e=>{peer.destroy();if(e.type==="unavailable-id"&&!saved)return hostStart();busy=false;err=e.type==="unavailable-id"?"Game code still in use — wait 20 seconds and tap Resume again.":"Connection problem ("+e.type+"). Check internet.";render()});
 peer.on("connection",c=>c.on("data",m=>onMsg(c,m)))}
function onMsg(c,m){
 if(!H)return;
 if(m.t==="join"){
  let p=hp(m.pid);
  if(!p){if(H.phase!=="lobby"){c.send({t:"no",why:"That game already started."});return}
   p={id:m.pid,name:String(m.name).slice(0,20),role:null,alive:true};H.P.push(p)}
  conns[p.id]=c;c.on("close",()=>{if(conns[p.id]===c)delete conns[p.id];render()});
  save();sendAll();render();return}
 const p=hp(m.pid||Object.keys(conns).find(k=>conns[k]===c));
 if(!p||!conns[p.id]||conns[p.id]!==c)return;
 if(m.t==="act")onAct(p,m)}
function onAct(p,m){
 const tg=hp(m.to);if(!tg||!tg.alive)return;
 if(m.k==="n"&&H.phase==="night"&&p.role!=="v"&&!done(p.id,"n")){
  if(p.role!=="dr"&&tg.id===p.id)return;
  H.acts[p.id]={...H.acts[p.id],nr:H.round,nt:tg.id};
  if(p.role==="d"&&p.alive)H.inv={round:H.round,target:tg.id,isM:tg.role==="m"}}
 if(m.k==="v"&&H.phase==="vote"&&p.alive&&tg.id!==p.id)H.acts[p.id]={...H.acts[p.id],vr:H.round,vt:tg.id};
 save();sendAll();render()}
function viewFor(p){
 const inv=(p.role==="d"&&H.inv&&H.inv.round===H.round)?{name:hp(H.inv.target).name,isM:H.inv.isM}:null;
 return {id:p.id,phase:H.phase,round:H.round,code:H.code,name:p.name,role:p.role,alive:p.alive,
  names:H.P.map(x=>({id:x.id,name:x.name,alive:x.alive})),msg:H.msg,winner:H.winner,
  vleft:Math.max(0,H.voteEnd-Date.now()),n:!!done(p.id,"n"),v:!!done(p.id,"v"),inv,
  roles:H.phase==="end"?H.P.map(x=>({name:x.name,role:x.role,alive:x.alive})):null}}
function sendAll(){if(!H)return;H.P.forEach(p=>{const c=conns[p.id];if(c&&c.open)try{c.send({t:"v",v:viewFor(p)})}catch(e){}})}
function commit(){save();sendAll();render()}
function dealRoles(){
 if(H.P.length<4)return;
 const roles=shuffle(["m","dr","d",...Array(H.P.length-3).fill("v")]);
 H.P.forEach((p,i)=>{p.role=roles[i];p.alive=true});H.phase="night";H.round=1;H.inv=null;H.acts={};commit()}
function morning(){
 const m=hRole("m"),dr=hRole("dr");
 const k=done(m.id,"n")?H.acts[m.id].nt:null;
 const sv=dr.alive&&done(dr.id,"n")?H.acts[dr.id].nt:null;
 let msg="🌤️ No one is dead tonight.";
 if(k&&k!==sv){const v=hp(k);v.alive=false;msg=`💀 ${v.name} was killed by the Mafia.`}
 finish(msg,"morning")}
function finish(msg,next){
 const m=hRole("m");H.msg=msg;H.phase=next;
 if(!m.alive){H.phase="end";H.winner="Villagers win! 🎉 The Mafia is out."}
 else if(hAlive().length<=2){H.phase="end";H.winner="Mafia wins! 🔪 Only the Mafia and one player are left."}
 commit()}
function startVote(){H.phase="vote";H.voteEnd=Date.now()+90000;commit()}
function tally(){
 if(!H||H.phase!=="vote")return;
 const c={};
 hAlive().forEach(p=>{const a=H.acts[p.id];if(a&&a.vr===H.round&&a.vt){const t=hp(a.vt);if(t&&t.alive)c[a.vt]=(c[a.vt]||0)+1}});
 const ids=Object.keys(c).sort((a,b)=>c[b]-c[a]);
 const sum=ids.map(i=>`${hp(i).name}: ${c[i]}`).join(" · ")||"no votes";
 let msg;
 if(!ids.length||(ids.length>1&&c[ids[0]]===c[ids[1]]))msg=`🤝 Tie — no one is out.\n(${sum})`;
 else{const v=hp(ids[0]);v.alive=false;msg=`🗳️ ${v.name} was voted out. They were ${R[v.role][1]}.\n(${sum})`}
 finish(msg,"voted")}
function nextNight(){H.phase="night";H.round++;H.inv=null;commit()}
/* ---------- PLAYER ---------- */
function playerJoin(c,n){
 if(!n||c.length!==4){err="Enter your name and the 4-letter code.";return render()}
 name=n;code=c;LS("mf_name",n);LS("mf_pcode",c);err="";mode="player";V=null;busy=true;render();
 if(peer)try{peer.destroy()}catch(e){}
 peer=new Peer();
 peer.on("open",connect);
 peer.on("error",e=>{busy=false;mode="";err=e.type==="peer-unavailable"?"Game not found. Check the code, and that the narrator's screen is on.":"Connection problem ("+e.type+").";render()})}
function connect(){
 conn=peer.connect("mafia-"+code,{reliable:true});
 conn.on("open",()=>conn.send({t:"join",pid,name}));
 conn.on("data",m=>{
  if(m.t==="v"){V=m.v;busy=false;vEnd=Date.now()+(m.v.vleft||0);render()}
  if(m.t==="no"){err=m.why;mode="";LS("mf_pcode",null);render()}});
 conn.on("close",()=>{if(mode!=="player")return;V=V;busy=true;render();setTimeout(()=>{if(mode==="player")playerJoin(code,name)},2500)})}
function send(k,to){if(conn&&conn.open)conn.send({t:"act",pid,k,to})}
function leave(){LS("mf_host",null);LS("mf_pcode",null);location.href=location.href.split("#")[0]}
function setSel(id){sel=id;render()}
function tick(){
 const t=document.getElementById("t");
 if(mode==="host"&&H&&H.phase==="vote"){const s=Math.ceil((H.voteEnd-Date.now())/1000);if(t)t.textContent=fmt(s);
  if(s<=0||hAlive().every(p=>done(p.id,"v")))tally()}
 else if(mode==="player"&&V&&V.phase==="vote"&&t)t.textContent=fmt(Math.ceil((vEnd-Date.now())/1000))}
setInterval(tick,500);
/* ---------- UI ---------- */
function grid(list){return `<div class="pick">${list.map(p=>`<button class="${sel===p.id?"on":""}" onclick="setSel('${p.id}')">${esc(p.name)}</button>`).join("")}</div>`}
function render(){
 const k=(H?H.phase+H.round:V?V.phase+V.round:"");if(k!==selKey){selKey=k;sel=null}
 let h="";
 if(busy&&!V&&!H){h=`<p class="mu" style="text-align:center;margin-top:60px">Connecting…</p>`}
 else if(busy&&V){h=`<p class="mu" style="text-align:center;margin-top:60px">Reconnecting…</p>`}
 else if(mode==="host"&&H)h=hostView();
 else if(mode==="player"&&V)h=playerView();
 else{
  const sh=LS("mf_host"),sc=LS("mf_pcode");let sj=null;try{sj=sh?JSON.parse(sh):null}catch(e){}
  h=`<h1>🎭 Mafia</h1><p class="mu">Everyone plays on their own phone. No sign-up.</p>
  <div class="card"><input id="nm" placeholder="Your name" maxlength="20" value="${esc(name)}">
  <button onclick="name=document.getElementById('nm').value.trim()||'Narrator';hostStart()">Create game (I'm the narrator)</button></div>
  <div class="card"><b>Join a game</b><input id="cd" placeholder="4-letter code" maxlength="4" value="${esc(hashCode)}" style="text-transform:uppercase">
  <button class="sec" onclick="playerJoin(document.getElementById('cd').value.trim().toUpperCase(),document.getElementById('nm').value.trim())">Join</button></div>
  ${sj?`<button class="sec" onclick="hostStart(JSON.parse(LS('mf_host')))">Resume game ${esc(sj.code)} as narrator</button>`:""}
  ${sc&&!sj?`<button class="sec" onclick="playerJoin(LS('mf_pcode'),LS('mf_name')||'')">Rejoin game ${esc(sc)}</button>`:""}
  ${err?`<p class="err">${esc(err)}</p>`:""}`}
 $.innerHTML=h}
function endView(winner,roles){return `<h2>Game over</h2><div class="card"><div class="big">${winner.includes("Villagers")?"🎉":"🔪"}</div><p style="text-align:center;font-size:18px"><b>${esc(winner)}</b></p></div><div class="card">${roles.map(p=>`<p class="${p.alive?"":"dead"}">${R[p.role][0]} ${esc(p.name)} <span class="tag">${R[p.role][1]}</span></p>`).join("")}</div><button onclick="leave()">New game</button>`}
function hostView(){
 const ph=H.phase;let h=`<p class="mu">Narrator · Game ${esc(H.code)} · Round ${H.round} · keep this screen on</p>`;
 const plist=()=>`<div class="card"><b>Players left (${hAlive().length})</b><p>${H.P.map(p=>`<span class="${p.alive?"":"dead"}">${esc(p.name)}</span>`).join(" · ")}</p></div>`;
 const roles=`<div class="card"><b>Roles</b>${H.P.map(p=>`<p class="${p.alive?"":"dead"}">${R[p.role]?R[p.role][0]:""} ${esc(p.name)} <span class="tag">${R[p.role]?R[p.role][1]:""}</span> ${conns[p.id]?"":"<span class='tag'>offline</span>"}</p>`).join("")}</div>`;
 if(ph==="lobby"){const link=location.href.split("#")[0]+"#"+H.code;
  h+=`<h2>Lobby</h2><div class="card"><p class="mu" style="text-align:center">Game code</p><div class="code">${esc(H.code)}</div></div>
  <button class="sec" onclick="navigator.share?navigator.share({title:'Mafia',text:'Join my Mafia game: '+${JSON.stringify(H.code)},url:'${link}'}):prompt('Copy this link',${JSON.stringify(link)})">📤 Share link</button>
  <div class="card"><b>Players (${H.P.length})</b><p>${H.P.map(p=>esc(p.name)+(conns[p.id]?"":" (offline)")).join(" · ")||"Waiting for players…"}</p></div>
  <p class="mu">You're the narrator — no role. Need 4+ players.</p><button ${H.P.length<4?"disabled":""} onclick="dealRoles()">Deal roles &amp; start</button>`}
 if(ph==="night"){const st=r=>done(hRole(r).id,"n")?"✅":"⏳";const all=["m","dr","d"].every(r=>done(hRole(r).id,"n"));
  h+=`<h2>🌙 Night ${H.round}</h2><p class="say">"Everyone, eyes closed. Mafia, doctor, detective — choose on your phone."</p><div class="card"><p>🔪 Mafia ${st("m")}</p><p>💉 Doctor ${st("dr")}</p><p>🔍 Detective ${st("d")}</p></div>${roles}<button ${all?"":"disabled"} onclick="morning()">Reveal morning ☀️</button>`}
 if(ph==="morning")h+=`<h2>☀️ Morning</h2><div class="card"><p style="text-align:center;font-size:18px">${esc(H.msg)}</p></div>${plist()}<button onclick="startVote()">Start debate &amp; vote (1:30)</button>`;
 if(ph==="vote"){const n=hAlive().filter(p=>done(p.id,"v")).length;h+=`<h2>🗳️ Debate &amp; vote</h2><div class="card"><div class="timer" id="t">${fmt(Math.ceil((H.voteEnd-Date.now())/1000))}</div><p class="mu" style="text-align:center">Votes in: ${n}/${hAlive().length}</p></div><button class="sec" onclick="tally()">End voting now</button>`}
 if(ph==="voted")h+=`<h2>Result</h2><div class="card"><p style="text-align:center;font-size:18px;white-space:pre-line">${esc(H.msg)}</p></div>${plist()}<button onclick="nextNight()">Next night 🌙</button>`;
 if(ph==="end")h+=endView(H.winner,H.P);
 return h}
function playerView(){
 const m=V,ph=m.phase;
 const plist=()=>`<div class="card"><b>Players left (${m.names.filter(p=>p.alive).length})</b><p>${m.names.map(p=>`<span class="${p.alive?"":"dead"}">${esc(p.name)}</span>`).join(" · ")}</p></div>`;
 if(ph==="lobby")return `<h2>Lobby</h2><div class="card"><p class="mu" style="text-align:center">Game ${esc(m.code)}</p><p style="text-align:center">You're in as <b>${esc(m.name)}</b> ✅</p><p class="mu" style="text-align:center">Waiting for the narrator to start…</p></div><p class="mu">Joined: ${m.names.map(p=>esc(p.name)).join(" · ")}</p>`;
 let h=`<div class="card"><button class="sec" style="margin:0" onclick="peek=!peek;render()">${peek?`${R[m.role][0]} You are the ${R[m.role][1]} — tap to hide`:"👁 Tap to see my role"}</button></div>`;
 if(!m.alive&&ph!=="end")h+=`<p class="mu" style="text-align:center">You're out 💀 — watch quietly.</p>`;
 const others=m.names.filter(p=>p.alive);
 if(ph==="night"){
  if(m.role==="v")h+=`<div class="night"><div class="big">🌙</div><p>Night. Eyes closed, phone down.</p></div>`;
  else if(m.n){
   if(m.role==="d"&&m.inv)h+=`<div class="card"><p class="mu" style="text-align:center">${esc(m.inv.name)} is…</p><div class="big">${m.inv.isM?"👍🏻":"👎🏻"}</div><p class="mu" style="text-align:center">${m.inv.isM?"The Mafia":"Not the Mafia"}</p></div>`;
   else h+=`<div class="night"><div class="big">🌙</div><p>Done. Eyes closed, phone down.</p></div>`}
  else{const title={m:"🔪 Who do you kill?",dr:"💉 Who do you save? (you can pick yourself)",d:"🔍 Who do you suspect?"}[m.role];
   h+=`<div class="card"><b>${title}</b>${grid(others.filter(p=>m.role==="dr"||p.id!==m.id))}</div><button ${sel===null?"disabled":""} onclick="send('n',sel)">Confirm</button>`}}
 if(ph==="morning")h+=`<h2>☀️ Morning</h2><div class="card"><p style="text-align:center;font-size:18px">${esc(m.msg)}</p></div>${plist()}`;
 if(ph==="vote"){h+=`<h2>🗳️ Debate &amp; vote</h2><div class="card"><div class="timer" id="t">${fmt(Math.ceil((vEnd-Date.now())/1000))}</div></div>`;
  if(m.alive)h+=`<div class="card"><b>${m.v?"Vote sent — tap to change":"Who is the Mafia?"}</b>${grid(others.filter(p=>p.id!==m.id))}</div><button ${sel===null?"disabled":""} onclick="send('v',sel)">${m.v?"Change vote":"Cast vote"}</button>`}
 if(ph==="voted")h+=`<h2>Result</h2><div class="card"><p style="text-align:center;font-size:18px;white-space:pre-line">${esc(m.msg)}</p></div>${plist()}<p class="mu" style="text-align:center">Waiting for the narrator — next night soon.</p>`;
 if(ph==="end")h+=endView(m.winner,m.roles);
 return h}
render();
if(hashCode&&!LS("mf_host")){/* link prefilled the code */}
</script></body></html>
